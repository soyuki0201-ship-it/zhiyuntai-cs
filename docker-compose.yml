version: '3.8'

services:
  app:
    build: .
    image: ${DOCKER_USERNAME}/zhiyuntai-cs:latest
    container_name: zhiyuntai-app
    restart: always
    environment:
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - HF_ENDPOINT=${HF_ENDPOINT}
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./image_cache:/app/image_cache
      - ./model_cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "python scripts/migrate_db.py &&
             python scripts/init_db.py &&
             gunicorn -w 2 -t 60 -b 0.0.0.0:8000 run:app"

  nginx:
    image: nginx:alpine
    container_name: zhiyuntai-nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static:ro
      - ./templates:/app/templates:ro
      - certbot_data:/etc/letsencrypt
      # 域名校验文件目录（WW_verify_*.txt / MP_verify_*.txt / ACME challenge）
      # 运维把校验文件放宿主机 <项目目录>/www/ 下即可生效，无需进容器
      - ./www:/var/www/html

  watchtower:
    image: containrrr/watchtower
    container_name: zhiyuntai-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
    command: zhiyuntai-app zhiyuntai-nginx

volumes:
  certbot_data:
