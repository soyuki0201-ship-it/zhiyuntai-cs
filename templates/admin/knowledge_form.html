<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ '编辑知识' if knowledge else '新增知识' }} - 智云台AI客服</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f6fa;color:#333;}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:200px;background:#1d1f25;color:#fff;padding:20px 0;}
.sidebar h2{padding:0 20px 20px;font-size:16px;border-bottom:1px solid #333;}
.sidebar a{display:block;padding:12px 20px;color:#999;text-decoration:none;font-size:14px;}
.sidebar a:hover{color:#fff;background:#2a2d35;}
.main{margin-left:200px;padding:20px 30px;}
h1{font-size:20px;margin-bottom:20px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:14px;color:#555;margin-bottom:4px;}
.form-group input,.form-group textarea,.form-group select{width:100%;max-width:600px;padding:8px 12px;border:1px solid #ddd;border-radius:4px;font-size:14px;}
.form-group textarea{min-height:200px;}
.btn{display:inline-block;padding:8px 18px;border:none;border-radius:4px;cursor:pointer;font-size:14px;text-decoration:none;}
.btn-primary{background:#518dfe;color:#fff;}
.btn-outline{background:#fff;border:1px solid #ddd;color:#666;margin-left:8px;}
.back-link{display:inline-block;margin-bottom:16px;color:#518dfe;text-decoration:none;font-size:14px;}
</style>
</head>
<body>
<div class="sidebar">
<h2>智云台AI客服</h2>
<a href="{{ url_for('admin.conversation_list') }}">全部对话</a>
<a href="{{ url_for('admin.pending_list') }}">待处理</a>
<a href="{{ url_for('admin.active_list') }}">处理中</a>
<a href="{{ url_for('admin.knowledge_list') }}">知识库</a>
<a href="/admin/logout" style="position:absolute;bottom:20px;left:20px;color:#666;font-size:13px;">退出登录</a>
</div>
<div class="main">
<a href="{{ url_for('admin.knowledge_list') }}" class="back-link">← 返回知识库</a>
<h1>{{ '编辑知识' if knowledge else '新增知识' }}</h1>
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group">
<label>标题</label>
<input type="text" name="title" value="{{ knowledge.title if knowledge else '' }}" required>
</div>
<div class="form-group">
<label>分类</label>
<select name="category">
    <option value="">无分类</option>
    <option value="产品功能介绍" {% if knowledge and knowledge.category == '产品功能介绍' %}selected{% endif %}>产品功能介绍</option>
    <option value="产品常见问题" {% if knowledge and knowledge.category == '产品常见问题' %}selected{% endif %}>产品常见问题</option>
    <option value="产品使用教程" {% if knowledge and knowledge.category == '产品使用教程' %}selected{% endif %}>产品使用教程</option>
    <option value="付费相关" {% if knowledge and knowledge.category == '付费相关' %}selected{% endif %}>付费相关</option>
    <option value="故障处理" {% if knowledge and knowledge.category == '故障处理' %}selected{% endif %}>故障处理</option>
    <option value="需求提出" {% if knowledge and knowledge.category == '需求提出' %}selected{% endif %}>需求提出</option>
    <option value="其他" {% if knowledge and knowledge.category == '其他' %}selected{% endif %}>其他</option>
</select>
</div>
<div class="form-group">
<label>内容</label>
<textarea name="content" required>{{ knowledge.content if knowledge else '' }}</textarea>
</div>
<div class="form-group">
<label>标签（逗号分隔）</label>
<input type="text" name="tags" value="{{ knowledge.tags if knowledge else '' }}" placeholder="例如：测略,使用教程">
</div>
<button type="submit" class="btn btn-primary">保存</button>
<a href="{{ url_for('admin.knowledge_list') }}" class="btn btn-outline">取消</a>
</form>
</div>
</body>
</html>
