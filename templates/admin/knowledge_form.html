{% extends "admin/base.html" %}
{% block page_title %}{{ '编辑知识' if knowledge else '新增知识' }}{% endblock %}
{% block content %}
<a href="{{ url_for('admin.knowledge_list') }}" style="display:inline-block;margin-bottom:16px;color:#4361ee;text-decoration:none;font-size:14px">← 返回知识库</a>
<h1 style="font-size:20px;margin-bottom:20px">{{ '编辑知识' if knowledge else '新增知识' }}</h1>
<div class="card"><div class="card-body">
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group"><label>标题 <span style="color:red">*</span></label><input type="text" name="title" value="{{ knowledge.title if knowledge else '' }}" required></div>
  <div class="form-group"><label>分类</label>
    <select name="category">
      <option value="">无分类</option>
      <option value="产品功能介绍" {% if knowledge and knowledge.category == '产品功能介绍' %}selected{% endif %}>产品功能介绍</option>
      <option value="产品常见问题" {% if knowledge and knowledge.category == '产品常见问题' %}selected{% endif %}>产品常见问题</option>
      <option value="产品使用教程" {% if knowledge and knowledge.category == '产品使用教程' %}selected{% endif %}>产品使用教程</option>
      <option value="付费相关" {% if knowledge and knowledge.category == '付费相关' %}selected{% endif %}>付费相关</option>
      <option value="故障处理" {% if knowledge and knowledge.category == '故障处理' %}selected{% endif %}>故障处理</option>
      <option value="需求提出" {% if knowledge and knowledge.category == '需求提出' %}selected{% endif %}>需求提出</option>
      <option value="其他" {% if knowledge and knowledge.category == '其他' %}selected{% endif %}>其他</option>
    </select>
  </div>
  <div class="form-group"><label>内容 <span style="color:red">*</span></label><textarea name="content" required style="min-height:200px">{{ knowledge.content if knowledge else '' }}</textarea></div>
  <div class="form-group"><label>标签（逗号分隔）</label><input type="text" name="tags" value="{{ knowledge.tags if knowledge else '' }}" placeholder="例如：测略,使用教程"></div>
  <div class="btn-group"><button type="submit" class="btn btn-primary">💾 保存</button><a href="{{ url_for('admin.knowledge_list') }}" class="btn btn-outline">取消</a></div>
</form>
</div></div>
{% endblock %}
