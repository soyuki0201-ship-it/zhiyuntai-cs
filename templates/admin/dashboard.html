{% extends "admin/base.html" %}
{% block page_title %}工作台{% endblock %}
{% block content %}
<div class="stats-row">
  <a class="stat-card" href="{{ url_for('admin.conversation_list', status='active') }}" style="text-decoration:none;display:block"><div class="label">今日咨询</div><div class="value">{{ today_count }}</div></a>
  <a class="stat-card" href="{{ url_for('admin.conversation_list', status='active') }}" style="text-decoration:none;display:block"><div class="label">AI 回复</div><div class="value">{{ ai_count }}</div></a>
  <a class="stat-card" href="{{ url_for('admin.pending_list') }}" style="text-decoration:none;display:block"><div class="label">转人工</div><div class="value">{{ handoff_count }}</div></a>
</div>
{% endblock %}
