{% extends "admin/base.html" %}
{% block page_title %}系统设置{% endblock %}
{% block head_extra %}
<script>
function saveSettings() {
  var f = new FormData(document.getElementById('settings-form'));
  f.append('csrf_token', document.querySelector('input[name=csrf_token]').value);
  var btn = document.querySelector('#settings-form .btn-primary');
  btn.disabled = true; btn.textContent = '⏳ 保存中...';
  fetch('{{ url_for("admin.settings_save") }}', { method: 'POST', body: f })
  .then(function(r){ return r.json(); })
  .then(function(d){
    var t = document.getElementById('toast');
    if (t) { t.style.background = '#323232'; t.textContent = d.message; t.style.display = 'block'; setTimeout(function(){ t.style.display='none'; }, 3000); }
  }).finally(function(){ btn.disabled = false; btn.textContent = '💾 保存设置'; });
}
</script>
{% endblock %}
{% block content %}
<form id="settings-form">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="card">
  <div class="card-header"><h3>👤 管理员账号</h3></div>
  <div class="card-body">
    <div class="form-row">
      <div class="form-group"><label>用户名</label><input type="text" value="{{ admin_username }}" readonly></div>
      <div class="form-group"><label>密码</label><input type="password" value="········" readonly></div>
    </div>
    <div style="font-size:12px;color:#999">管理员账号密码在环境变量中配置，重启生效</div>
  </div>
</div>
<div class="card">
  <div class="card-header"><h3>🗄️ 数据管理</h3></div>
  <div class="card-body">
    <div class="form-row">
      <div class="form-group"><label>对话保留天数</label><input type="number" name="conversation_ttl" value="{{ conversation_ttl }}" min="1" max="365"><div class="hint">超过此天数的对话自动清理</div></div>
      <div class="form-group"><label>接管超时释放（分钟）</label><input type="number" name="handoff_timeout" value="{{ handoff_timeout }}" min="1" max="1440"><div class="hint">超时自动恢复 AI 回复</div></div>
    </div>
  </div>
</div>
<div class="card">
  <div class="card-header"><h3>ℹ️ 系统信息</h3></div>
  <div class="card-body">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:13px">
      <div><span style="color:#999">版本</span><br>v1.0.0</div>
      <div><span style="color:#999">数据库</span><br>MySQL 8.0</div>
      <div><span style="color:#999">向量库</span><br>ChromaDB</div>
      <div><span style="color:#999">部署方式</span><br>Docker</div>
    </div>
  </div>
</div>
<div style="margin-top:16px"><button type="button" class="btn btn-primary" onclick="saveSettings()">💾 保存设置</button></div>
</form>
{% endblock %}
