server {
    listen 80;
    server_name yunzhiai-dev.ts-martech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 企微/公众号 域名所有权校验文件（WW_verify_*.txt / MP_verify_*.txt）
    # 文件放宿主机的 <项目目录>/www/ 下（compose 已绑定到 /var/www/html）
    location ~ ^/(WW_verify|MP_verify)[A-Za-z0-9]+\.txt$ {
        root /var/www/html;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name yunzhiai-dev.ts-martech.com;

    ssl_certificate /etc/letsencrypt/live/yunzhiai-dev.ts-martech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yunzhiai-dev.ts-martech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 企微/公众号 域名所有权校验文件（与 80 端口同规则）
    location ~ ^/(WW_verify|MP_verify)[A-Za-z0-9]+\.txt$ {
        root /var/www/html;
        access_log off;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
